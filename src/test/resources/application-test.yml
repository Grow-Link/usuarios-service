spring:
  datasource:
    url: jdbc:h2:mem:growlink;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

growlink:
  jwt:
    secret: test_secret_only_used_in_the_test_profile_32bytes+
    expiration-minutes: 60
  # puerto cerrado a proposito: los tests no deben depender de si cursos-service
  # esta corriendo o no en la maquina de quien los ejecuta
  cursos-service:
    base-url: http://localhost:19999

# El tope por IP se apaga en las pruebas: todas salen de la misma IP y, sumadas, se pasarian del tope y se
# empezarian a estorbar entre ellas (una prueba fallaria por culpa de las que corrieron antes). LimitePorIpTest
# lo prende con el valor de produccion y en su propio contexto, que es donde esa regla se prueba de verdad.
seguridad:
  limite-ip:
    maximo-por-minuto: 0

observabilidad:
  metricas-token: token-de-metricas-solo-para-pruebas
