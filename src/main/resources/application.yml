server:
  port: ${PORT:8080}
  # ATRIBUTO: seguridad. Delante del servicio hay un proxy (el front end de Azure App Service, nginx en el stack
  # local), asi que la IP del socket es la suya y no la del cliente. Con `native`, el RemoteIpValve de Tomcat
  # traduce X-Forwarded-For y X-Forwarded-Proto a getRemoteAddr(), getScheme() e isSecure() antes de que corra
  # cualquier filtro, y solo le cree a esas cabeceras cuando la conexion llega de un proxy de confianza
  # (server.tomcat.remoteip.internal-proxies, que por defecto son las redes privadas y 169.254.x.x). Asi el tope
  # por IP cuenta la IP que pone el proxy y no la que escriba el cliente (ver LimitePorIpFilter).
  #
  # Va escrito a proposito: sin esta linea, Spring Boot lo decide solo segun la plataforma que detecte
  # (CloudPlatform.AZURE_APP_SERVICE con las variables WEBSITE_*), asi que el valve estaba puesto en Azure y no
  # en local, y la configuracion no decia nada de eso en ninguna parte.
  forward-headers-strategy: native

spring:
  application:
    name: growlink-app
  main:
    # los logs salen en JSON (ver logback-spring.xml) y el letrero de Spring no lo es: romperia la regla de que cada
    # linea de la salida es un evento que el almacen de logs puede leer
    banner-mode: "off"
  datasource:
    url: jdbc:postgresql://localhost:5433/growlink
    username: growlink
    # la contrasena NO va escrita aqui: viene de SPRING_DATASOURCE_PASSWORD (Azure, Docker y la demo la ponen). Para correr contra el
    # Postgres del docker-compose de este repo: SPRING_DATASOURCE_PASSWORD=growlink mvn spring-boot:run. Las pruebas usan H2 (application-test.yml)
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

growlink:
  jwt:
    # esto es solo para desarrollo local, en cualquier otro ambiente hay que poner GROWLINK_JWT_SECRET
    secret: ${GROWLINK_JWT_SECRET:CHANGE_ME_local_dev_only_not_a_real_secret_32bytes+}
    expiration-minutes: ${GROWLINK_JWT_EXPIRATION_MINUTES:1440}
  # llave para las llamadas de servicio a servicio (trivia -> usuarios), debe ser la misma en trivia-service
  internal-key: ${GROWLINK_INTERNAL_KEY:CHANGE_ME_local_dev_only_internal_key}
  # confidencialidad (S3, ver CifradoFilter): el cuerpo de las peticiones y respuestas va cifrado ademas de HTTPS.
  #   clave-privada: llave RSA de 2048 bits en PKCS#8 (base64). Debe ser la misma en todas las instancias
  #                  (y en los tres servicios, para que el front use una sola). Sin ella se crea una temporal.
  #   obligatorio:   true = lo que llegue sin cifrar se rechaza con 400 (salvo salud, metricas, WS y llamadas internas)
  cifrado:
    clave-privada: ${GROWLINK_CIFRADO_CLAVE_PRIVADA:}
    obligatorio: ${GROWLINK_CIFRADO_OBLIGATORIO:false}
  ai:
    model: ${GROWLINK_AI_MODEL:claude-opus-5}
  cursos-service:
    base-url: ${GROWLINK_CURSOS_SERVICE_URL:http://localhost:8086}
    # ATRIBUTO: disponibilidad. Si cursos-service no contesta en estos milisegundos se sigue sin el (el Home y el jardin
    # degradan en vez de quedarse colgados esperando)
    connect-timeout-ms: ${GROWLINK_CURSOS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${GROWLINK_CURSOS_READ_TIMEOUT_MS:3000}

# ATRIBUTO: seguridad. De donde sale la identidad de quien llama. El mismo interruptor que trivia-service y
# cursos-service, y con los mismos nombres de variables, para que los tres se configuren igual.
#
#   legacy (por defecto) = como viene funcionando: el login quemado de /api/auth/login y los tokens que firma
#                          este servicio. No se rompe ningun cliente de los que ya existen.
#   oidc                 = la identidad la pone Microsoft (Entra ID). Cada peticion trae su JWT, se verifica la
#                          firma contra el JWKS del emisor (solo RS256, con kid, exp, iss y aud) y el sub del
#                          token se traduce a un usuario local, que se crea en el primer ingreso.
#
# Un valor distinto de esos dos tumba el arranque a proposito (ver AuthModeConfig): quedarse callado cayendo a
# legacy seria desplegar con el login viejo creyendo que ya esta puesto el de Microsoft.
auth:
  mode: ${AUTH_MODE:legacy}

  # Para cuantos directorios de Entra ID vale la app (ver ValidadorDeEmisor):
  #
  #   false (por defecto) = un solo directorio. El emisor es el de AUTH_ISSUER_URI, comparado tal cual. Es el
  #                         comportamiento de siempre, no cambia nada.
  #   true                = la app esta registrada para cuentas de cualquier directorio organizacional y cuentas
  #                         personales de Microsoft. Entonces el iss del token trae el tenant de QUIEN inicia
  #                         sesion y no se puede comparar con un valor fijo: habria que rechazar a casi todos.
  #
  # Con true NO se da por bueno cualquier emisor. Se exige que el iss sea exactamente un emisor v2.0 de Entra
  # (https://login.microsoftonline.com/<guid-del-tenant>/v2.0, con el patron completo y anclado, asi que un
  # http:// o un host como login.microsoftonline.com.evil.com se rechazan) y que el claim tid sea ese mismo GUID.
  multi-tenant: ${AUTH_MULTI_TENANT:false}

  # Solo con multi-tenant: GUID de los tenants que pueden entrar, separados por comas. Vacio = cualquier tenant
  # que cumpla lo de arriba, que es lo que quiere decir multi-tenant. Un GUID mal escrito tumba el arranque, para
  # que no deje fuera a una organizacion entera sin que nadie se entere.
  # El tenant de las cuentas personales de Microsoft es 9188040d-6c67-4c5b-b112-36a304b66dad: si se pone lista y
  # se quiere que esas cuentas sigan entrando, hay que incluirlo.
  allowed-tenants: ${AUTH_ALLOWED_TENANTS:}

  oidc:
    # Quien firma los tokens que se aceptan, p.ej. https://login.microsoftonline.com/<tenant>/v2.0. Obligatorio
    # con multi-tenant=false; con multi-tenant=true no se usa (el emisor viene en el token y se valida por patron).
    issuer-uri: ${AUTH_ISSUER_URI:}
    # Para que aplicacion tienen que venir los tokens. Acepta una LISTA separada por comas y basta con que el aud
    # del token coincida con una: segun como quede configurada la app, Entra pone api://<client-id> o el
    # <client-id> pelado, y tener que adivinar cual obligaria a redeplegar para corregirlo.
    # p.ej. api://growlink-usuarios,7f3c1b2a-....
    audience: ${AUTH_AUDIENCE:}
    # Donde estan las llaves publicas. Si se deja vacio:
    #   multi-tenant=true  -> https://login.microsoftonline.com/common/discovery/v2.0/keys (de ahi publica Entra
    #                         las llaves de firma de todos los tenants)
    #   multi-tenant=false -> el estandar de OIDC, <issuer-uri>/.well-known/jwks.json. OJO con Entra ID: ahi las
    #                         llaves NO estan en esa ruta, hay que poner
    #                         AUTH_JWKS_URI=https://login.microsoftonline.com/<tenant>/discovery/v2.0/keys
    jwks-uri: ${AUTH_JWKS_URI:}
  # Los correos que quedan con rol ADMIN, separados por comas y sin distinguir mayusculas. ADMIN no se puede
  # escoger desde la aplicacion (pedirlo sin estar en esta lista da 403): quien es administrador es una decision
  # del despliegue, porque si se pudiera escoger, cualquiera se lo daria.
  admin-emails: ${AUTH_ADMIN_EMAILS:}

# ATRIBUTO: seguridad y disponibilidad. Tope de peticiones por IP (ver LimitePorIpFilter), para todos los
# endpoints y antes de la seguridad y de la base de datos. La IP se cuenta de getRemoteAddr() sin el puerto: la
# pone el proxy de confianza a traves del RemoteIpValve (ver server.forward-headers-strategy arriba), no el
# cliente. Cada replica cuenta por su lado. maximo-por-minuto: 0 lo apaga.
seguridad:
  limite-ip:
    maximo-por-minuto: ${LIMITE_IP_MAXIMO_POR_MINUTO:300}
    ventana-segundos: ${LIMITE_IP_VENTANA_SEGUNDOS:60}

# ATRIBUTO: observabilidad (negocio). Cuando empieza una sesion, para la metrica growlink.sesiones.iniciadas (ver
# RegistroDeSesiones). En modo legacy, cada login. En modo oidc, la primera peticion de la persona despues de
# `inactividad-minutos` sin ninguna (y su primer ingreso). La ultima actividad se guarda en la base como mucho cada
# `refresco-minutos`, para no escribir en cada peticion; por eso una sesion se da por terminada tras
# inactividad - refresco a inactividad minutos sin actividad (25 a 30 con los valores por defecto).
# refresco tiene que ser mayor que 0 y menor que inactividad, si no el servicio no arranca.
sesiones:
  inactividad-minutos: ${SESIONES_INACTIVIDAD_MINUTOS:30}
  refresco-minutos: ${SESIONES_REFRESCO_MINUTOS:5}

# ATRIBUTO: disponibilidad. Se expone la salud (sin detalles: no filtra nombres de bases ni versiones) y sus dos
# sondas: liveness (el proceso vive) y readiness (puede atender: incluye la base de datos).
# ATRIBUTO: observabilidad. Y las metricas para Prometheus (/actuator/prometheus), que solo contestan con el token
# del scrape (ver TokenDeMetricas y SecurityConfig). Los tableros de Grafana estan en el repo infra.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # Spring Boot NO mete la base en readiness por su cuenta: sin esto, una replica sin base seguia diciendo que
        # estaba lista y el balanceador le seguia mandando trafico. Liveness, en cambio, no la mira a proposito:
        # reiniciar la replica no arregla la base (ver ReadinessConLaBaseDeDatosTest)
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      # cubetas de latencia de las peticiones HTTP, para sacar el p95 por replica en el tablero. Son pocas y fijas
      # (no el histograma completo de Micrometer) para no multiplicar las series por cada ruta y cada replica
      slo:
        http.server.requests: 10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s

observabilidad:
  # nombre de esta replica para la etiqueta comun "instancia" de las metricas (ver MetricsConfig). En Azure App
  # Service WEBSITE_INSTANCE_ID ya viene puesta; si esta vacia se usa el nombre del host
  instancia: ${WEBSITE_INSTANCE_ID:}
  # el token que tiene que traer Prometheus en la cabecera X-Metricas-Token. Vacio = /actuator/prometheus cerrado
  metricas-token: ${METRICAS_TOKEN:}

# ATRIBUTO: observabilidad. Los logs salen en JSON, con el id de la peticion (X-Request-Id) en el campo rid de cada
# linea (ver logback-spring.xml). El patron de abajo es el del perfil logs-texto, para leerlos a ojo en desarrollo:
# ahi el id sale como [rid=...].
logging:
  level:
    com.growlink: INFO
  pattern:
    level: "%5p [rid=%X{rid:-}]"
