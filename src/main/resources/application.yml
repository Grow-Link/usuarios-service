server:
  port: 8080

spring:
  application:
    name: growlink-app
  datasource:
    url: jdbc:postgresql://localhost:5432/growlink
    username: growlink
    password: growlink
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

growlink:
  jwt:
    # esto es solo para desarrollo local, en cualquier otro ambiente hay que poner GROWLINK_JWT_SECRET
    secret: ${GROWLINK_JWT_SECRET:CHANGE_ME_local_dev_only_not_a_real_secret_32bytes+}
    expiration-minutes: ${GROWLINK_JWT_EXPIRATION_MINUTES:1440}
  ai:
    model: ${GROWLINK_AI_MODEL:claude-opus-5}

logging:
  level:
    com.growlink: INFO
